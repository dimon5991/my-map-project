<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Локації постачальників, розробників та глобальної логістики</title>
    
    <!-- Leaflet CSS -->
    <link 
        rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" 
    />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0c1017;
            color: #ffffff;
        }

        #map {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Анімація біжучих пунктирних ліній */
        @keyframes supplyFlow {
            to {
                stroke-dashoffset: -36;
            }
        }

        @keyframes dash {
            to {
                stroke-dashoffset: -40;
            }
        }

        /* Полілінії для робототехніки */
        .supply-line-robot {
            stroke: #00d2ff;
            stroke-width: 2.2;
            stroke-opacity: 0.8;
            stroke-dasharray: 6, 6;
            animation: supplyFlow 1.5s linear infinite;
            pointer-events: none !important;
        }

        /* Полілінії Японії та кастомні пунктири */
        .supply-line-custom {
            stroke-width: 2.2;
            stroke-opacity: 0.85;
            stroke-dasharray: 6, 6;
            animation: supplyFlow 1.5s linear infinite;
            pointer-events: none !important;
        }

        /* Полілінії глобальної логістики */
        .animated-route-stage1 {
            stroke-dasharray: 8, 8;
            animation: dash 1.8s linear infinite;
        }

        .animated-route-stage2 {
            stroke-dasharray: 6, 6;
            animation: dash 1.2s linear infinite;
        }

        /* Анімована лінія постачання цементу Індії */
        .logistics-line-india {
            stroke-dasharray: 8, 8;
            animation: dash 1.5s linear infinite;
        }

        /* Верхній заголовок */
        .info-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(12, 16, 23, 0.9);
            backdrop-filter: blur(8px);
            padding: 12px 28px;
            border-radius: 8px;
            border: 1px solid rgba(0, 210, 255, 0.4);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            text-align: center;
            pointer-events: none;
        }

        .info-panel h1 {
            font-size: 14px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #00d2ff;
            font-weight: 700;
        }

        /* Меню шарів та підвкладок */
        .controls-container {
            position: absolute;
            top: 20px;
            left: 60px;
            z-index: 1000;
            display: flex;
            gap: 12px;
        }

        .dropdown-panel {
            position: relative;
        }

        .dropdown-btn {
            background: rgba(12, 16, 23, 0.9);
            backdrop-filter: blur(8px);
            color: #00d2ff;
            border: 1px solid rgba(0, 210, 255, 0.4);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-width: 200px;
            transition: all 0.3s ease;
        }

        .dropdown-btn:hover {
            background: rgba(15, 23, 42, 0.95);
            border-color: #00d2ff;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.3);
        }

        .dropdown-arrow {
            font-size: 10px;
            transition: transform 0.3s ease;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            width: 100%;
            max-height: 380px;
            overflow-y: auto;
            background: rgba(12, 16, 23, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            flex-direction: column;
        }

        .dropdown-panel.open .dropdown-content {
            display: flex;
        }

        .dropdown-panel.open .dropdown-arrow {
            transform: rotate(180deg);
        }

        .dropdown-item {
            padding: 10px 16px;
            background: transparent;
            color: #cbd5e1;
            border: none;
            text-align: left;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dropdown-item:hover {
            background: rgba(0, 210, 255, 0.15);
            color: #ffffff;
        }

        .dropdown-item.active {
            color: #00d2ff;
            background: rgba(0, 210, 255, 0.1);
        }

        .company-color-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        /* Маркери */
        .custom-marker-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .marker-dot {
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-sizing: border-box;
            transition: transform 0.2s ease;
        }

        .dot-robot {
            width: 16px;
            height: 16px;
            background-color: #ffcc00;
            box-shadow: 0 0 10px #ffcc00, 0 0 20px #ffcc00;
        }

        .dot-hub-robot {
            width: 22px;
            height: 22px;
            background-color: #00d2ff;
            border: 2.5px solid #ffffff;
            box-shadow: 0 0 15px #00d2ff, 0 0 30px #00d2ff;
            animation: pulseHubDot 1.6s infinite alternate ease-in-out;
        }

        @keyframes pulseHubDot {
            from { transform: scale(1); box-shadow: 0 0 10px #00d2ff, 0 0 20px #00d2ff; }
            to { transform: scale(1.3); box-shadow: 0 0 20px #00d2ff, 0 0 35px #00d2ff; }
        }

        .dot-construction {
            width: 16px;
            height: 16px;
            background-color: #00d2ff;
            box-shadow: 0 0 10px #00d2ff, 0 0 20px #00d2ff;
        }

        .dot-cement {
            width: 16px;
            height: 16px;
            background-color: #a855f7;
            box-shadow: 0 0 10px #a855f7, 0 0 20px #a855f7;
        }

        /* Маркери Індії */
        .custom-india-construction-marker {
            width: 16px;
            height: 16px;
            background-color: #00ffaa;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px #00ffaa, 0 0 20px #00ffaa;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .custom-india-construction-marker:hover {
            transform: scale(1.35);
            box-shadow: 0 0 15px #00ffaa, 0 0 30px #00ffaa;
        }

        .custom-india-cement-marker {
            width: 16px;
            height: 16px;
            background-color: #ff0055;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .custom-india-cement-marker:hover {
            transform: scale(1.35);
            box-shadow: 0 0 15px #ff0055, 0 0 30px #ff0055;
        }

        /* Маркери Канади */
        .custom-canada-construction-marker {
            width: 16px;
            height: 16px;
            background-color: #00ffcc;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .custom-canada-construction-marker:hover {
            transform: scale(1.35);
            box-shadow: 0 0 15px #00ffcc, 0 0 30px #00ffcc;
        }

        .custom-canada-cement-marker {
            width: 14px;
            height: 14px;
            background-color: #ff3366;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px #ff3366, 0 0 20px #ff3366;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .custom-canada-cement-marker:hover {
            transform: scale(1.35);
            box-shadow: 0 0 15px #ff3366, 0 0 30px #ff3366;
        }

        /* Маркери ланцюга логістики */
        .custom-plant-marker {
            width: 16px;
            height: 16px;
            background-color: #00d2ff;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px #00d2ff, 0 0 20px #00d2ff;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .custom-component-marker {
            width: 16px;
            height: 16px;
            background-color: #00ff88;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .custom-final-marker {
            width: 16px;
            height: 16px;
            background-color: #e040fb;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px #e040fb, 0 0 20px #e040fb;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .custom-factory-marker {
            width: 16px;
            height: 16px;
            background-color: #ff3333;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px #ff3333, 0 0 20px #ff3333;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .custom-destination-marker {
            width: 16px;
            height: 16px;
            background-color: #00ffff;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .custom-marker-wrapper:hover .marker-dot,
        .custom-plant-marker:hover,
        .custom-component-marker:hover,
        .custom-final-marker:hover,
        .custom-factory-marker:hover,
        .custom-destination-marker:hover {
            transform: scale(1.35);
        }

        /* Стилі Popup */
        .leaflet-popup-content-wrapper {
            background: rgba(15, 23, 42, 0.98) !important;
            backdrop-filter: blur(10px);
            color: #e2e8f0 !important;
            border: 1px solid #00d2ff;
            border-radius: 10px;
            box-shadow: 0 0 24px rgba(0, 210, 255, 0.35);
            padding: 0 !important;
            overflow: hidden;
        }

        .leaflet-popup-content {
            margin: 0 !important;
            line-height: 1.45;
            max-height: 440px;
            overflow-y: auto;
            width: 310px !important;
        }

        .leaflet-popup-tip {
            background: rgba(15, 23, 42, 0.98) !important;
            border: 1px solid #00d2ff;
        }

        .leaflet-container a.leaflet-popup-close-button {
            color: #ffffff !important;
            top: 8px !important;
            right: 10px !important;
            font-size: 18px !important;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            width: 22px;
            height: 22px;
            line-height: 20px;
            text-align: center;
            z-index: 10;
        }

        .leaflet-container a.leaflet-popup-close-button:hover {
            color: #ffcc00 !important;
        }

        .card-img-wrap {
            width: 100%;
            height: 140px;
            background: #1e293b;
            overflow: hidden;
            position: relative;
        }

        .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-body {
            padding: 14px 16px;
        }

        .card-badge {
            display: inline-block;
            font-size: 9.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 2px 7px;
            border-radius: 4px;
            margin-bottom: 6px;
        }

        .badge-robot, .badge-construction {
            background: rgba(0, 210, 255, 0.15);
            color: #00d2ff;
            border: 1px solid rgba(0, 210, 255, 0.4);
        }

        .badge-cement {
            background: rgba(168, 85, 247, 0.15);
            color: #a855f7;
            border: 1px solid rgba(168, 85, 247, 0.4);
        }

        .popup-title {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .popup-company {
            font-size: 12px;
            font-weight: 700;
            color: #ffcc00;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 6px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-section-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 2px;
            margin-top: 6px;
        }

        .card-role-text {
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        .popup-desc {
            font-size: 11.5px;
            line-height: 1.45;
            color: #cbd5e1;
        }

        .popup-desc b { color: #ffffff; }
        .popup-desc ul { padding-left: 15px; margin-top: 4px; }
        .popup-desc li { margin-bottom: 4px; }

        .specs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 6px;
            padding: 8px;
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .spec-item {
            display: flex;
            flex-direction: column;
        }

        .spec-item span:first-child {
            font-size: 9px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .spec-item span:last-child {
            font-size: 11px;
            font-weight: 600;
            color: #ffffff;
        }

        /* Теги для кроків логістики */
        .popup-tag {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            margin-top: 8px;
            text-transform: uppercase;
        }
        .tag-refinery { background: rgba(0, 210, 255, 0.2); color: #00d2ff; border: 1px solid #00d2ff; }
        .tag-component { background: rgba(0, 255, 136, 0.2); color: #00ff88; border: 1px solid #00ff88; }
        .tag-final { background: rgba(224, 64, 251, 0.2); color: #e040fb; border: 1px solid #e040fb; }
        .tag-wire { background: rgba(255, 51, 51, 0.2); color: #ff3333; border: 1px solid #ff3333; }
        .tag-dest { background: rgba(0, 255, 255, 0.2); color: #00ffff; border: 1px solid #00ffff; }
        .tag-cement { background: rgba(168, 85, 247, 0.2); color: #a855f7; border: 1px solid #a855f7; }
        .tag-india-construction { background: rgba(0, 255, 170, 0.2); color: #00ffaa; border: 1px solid #00ffaa; }
        .tag-india-cement { background: rgba(255, 0, 85, 0.2); color: #ff0055; border: 1px solid #ff0055; }
        .tag-canada-construction { background: rgba(0, 255, 204, 0.2); color: #00ffcc; border: 1px solid #00ffcc; }
        .tag-canada-cement { background: rgba(255, 51, 102, 0.2); color: #ff3366; border: 1px solid #ff3366; }
    </style>
</head>
<body>

    <div class="controls-container">
        <!-- Меню вибору головного шару -->
        <div class="dropdown-panel" id="dropdownPanelMain">
            <button class="dropdown-btn" onclick="toggleDropdown('dropdownPanelMain')">
                <span id="selectedOptionMain">🤖 Boston Dynamics</span>
                <span class="dropdown-arrow">▼</span>
            </button>
            <div class="dropdown-content">
                <button class="dropdown-item active" id="item-robots" onclick="selectOption('robots')">🤖 Boston Dynamics</button>
                <button class="dropdown-item" id="item-construction" onclick="selectOption('construction')">🏗️ Будівельні компанії & Цемент США</button>
                <button class="dropdown-item" id="item-canada-construction" onclick="selectOption('canada-construction')">🇨🇦 Будівництво (Канада)</button>
                <button class="dropdown-item" id="item-india-cement" onclick="selectOption('india-cement')">🧱 Будівельні компанії Індії та цементні заводи</button>
                <button class="dropdown-item" id="item-wire-logistics" onclick="selectOption('wire-logistics')">🏭 Дріт та 🚢 Логістика</button>
                <button class="dropdown-item" id="item-routes" onclick="selectOption('routes')">🚚 Ланцюги постачання</button>
                <button class="dropdown-item" id="item-japan" onclick="selectOption('japan')">⚡ Електростанції Японії</button>
            </div>
        </div>

        <!-- Підвкладки з енергетичними компаніями Японії -->
        <div class="dropdown-panel" id="dropdownPanelSub" style="display: none;">
            <button class="dropdown-btn" onclick="toggleDropdown('dropdownPanelSub')">
                <span id="selectedOptionSub">🏢 Всі компанії</span>
                <span class="dropdown-arrow">▼</span>
            </button>
            <div class="dropdown-content" id="subDropdownContent">
                <!-- Динамічно генерується JS -->
            </div>
        </div>
    </div>

    <!-- Заголовок -->
    <div class="info-panel">
        <h1 id="panel-title">Ключові локації та ланцюжки постачання Boston Dynamics</h1>
    </div>

    <div id="map"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

        function createCurvePoints(fromCoords, toCoords) {
            const lat1 = fromCoords[0], lng1 = fromCoords[1];
            const lat2 = toCoords[0], lng2 = toCoords[1];

            const midLat = (lat1 + lat2) / 2 + Math.abs(lng1 - lng2) * 0.12;
            const midLng = (lng1 + lng2) / 2;

            const points = [];
            for (let t = 0; t <= 1; t += 0.05) {
                const lat = (1 - t) * (1 - t) * lat1 + 2 * (1 - t) * t * midLat + t * t * lat2;
                const lng = (1 - t) * (1 - t) * lng1 + 2 * (1 - t) * t * midLng + t * t * lng2;
                points.push([lat, lng]);
            }
            return points;
        }

        function drawPairConnections(sourceList, targetList, options = {}) {
            const defaultStyle = {
                color: '#00ffff',
                weight: 1.5,
                opacity: 0.6,
                dashArray: '5, 8'
            };
            const style = { ...defaultStyle, ...options };

            sourceList.forEach((src, idx) => {
                const target = targetList[idx % targetList.length];
                const polyline = L.polyline([src.coords, target.coords], style).addTo(map);
                currentLines.push(polyline);
            });
        }

            canadaConstructionLocations.forEach(loc => {
                const marker = L.marker(loc.coords, { icon: constrIcon }).addTo(map);
                marker.bindPopup(`
                    <div style="padding: 12px;">
                        <div class="popup-title">🏗️ ${loc.title}</div>
                        <div class="popup-desc">${loc.text}</div>
                        <span class="popup-tag tag-canada-construction">Будівельний хаб (Канада)</span>
                    </div>
                `, { maxWidth: 300 });
                currentMarkers.push(marker);
            });

            // 2. Нанесення цементних заводів та прокладання логістичних ліній
            canadaCementPlants.forEach(plant => {
                const plantMarker = L.marker(plant.coords, { icon: cementIcon }).addTo(map);
                plantMarker.bindPopup(`
                    <div style="padding: 12px;">
                        <div class="popup-title">🏭 Цементний завод</div>
                        <div class="popup-desc"><b>${plant.name}</b><br>Основний постачальник цементу та бетону для регіональних будівельних підрядників.</div>
                        <span class="popup-tag tag-canada-cement">Цементний завод Канади</span>
                    </div>
                `, { maxWidth: 280 });
                currentMarkers.push(plantMarker);

                // Знаходження найближчого будівельного хабу для побудови логістичного зв'язку
                let closestHub = null;
                let minDistance = Infinity;

                canadaConstructionLocations.forEach(hub => {
                    const dist = Math.hypot(
                        hub.coords[0] - plant.coords[0],
                        hub.coords[1] - plant.coords[1]
                    );
                    if (dist < minDistance) {
                        minDistance = dist;
                        closestHub = hub;
                    }
                });

                if (closestHub) {
                    const polyline = L.polyline([plant.coords, closestHub.coords], {
                        color: '#ff3366',
                        weight: 1.5,
                        opacity: 0.7,
                        dashArray: '4, 8'
                    }).addTo(map);

                    polyline.bindTooltip(`Маршрут постачання: ${plant.name} ➔ ${closestHub.title.split(' ')[0]}`, {
                        sticky: true
                    });

                    currentLines.push(polyline);
                }
            });

            map.flyTo([52.0, -96.0], 4);
        }

        function renderIndiaCementWithLogistics() {
            clearLayers();

            const constrIcon = L.divIcon({
                className: 'custom-india-construction-marker',
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });

            indiaConstructionLocations.forEach(loc => {
                const marker = L.marker(loc.coords, { icon: constrIcon }).addTo(map);
                const popupContent = `
                    <div style="padding: 12px;">
                        <div class="popup-title">🏗️ ${loc.title}</div>
                        <div class="popup-desc">${loc.text}</div>
                        <span class="popup-tag tag-india-construction">Будівельна компанія Індії</span>
                    </div>
                `;
                marker.bindPopup(popupContent, { maxWidth: 300 });
                currentMarkers.push(marker);
            });

            const cementIcon = L.divIcon({
                className: 'custom-india-cement-marker',
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });

            indiaCementPlants.forEach(plant => {
                const marker = L.marker(plant.coords, { icon: cementIcon }).addTo(map);
                const popupContent = `
                    <div style="padding: 12px;">
                        <div class="popup-title">🧱 ${plant.title}</div>
                        <div class="popup-desc">${plant.text}</div>
                        <span class="popup-tag tag-india-cement">Цементний завод Індії</span>
                    </div>
                `;
                marker.bindPopup(popupContent, { maxWidth: 300 });
                currentMarkers.push(marker);

                const targetsList = plant.targets || (plant.targetCoords ? [plant.targetCoords] : []);
                
                targetsList.forEach(target => {
                    const polyline = L.polyline([plant.coords, target], {
                        color: '#ff0055',
                        weight: 2,
                        opacity: 0.8,
                        className: 'logistics-line-india'
                    }).addTo(map);

                    currentLines.push(polyline);
                });
            });

            map.flyTo([20.5937, 78.9629], 5);
        }

        function renderJapanPowerPlantsView() {
            clearLayers();

            const targetCompanies = selectedCompanyId === 'all' 
                ? japanCompanies 
                : japanCompanies.filter(c => c.id === selectedCompanyId);

            if (selectedCompanyId !== 'all' && targetCompanies.length > 0 && targetCompanies[0].plants.length > 0) {
                map.flyTo(targetCompanies[0].plants[0].coords, 7);
            } else {
                map.flyTo([36.5, 138.0], 5);
            }

            targetCompanies.forEach(comp => {
                for (let i = 0; i < comp.plants.length - 1; i++) {
                    const plantA = comp.plants[i];
                    const plantB = comp.plants[i + 1];

                    const curveCoords = createCurvePoints(plantA.coords, plantB.coords);
                    const polyline = L.polyline(curveCoords, {
                        className: 'supply-line-custom',
                        color: comp.color,
                        interactive: false
                    }).addTo(map);
                    currentLines.push(polyline);
                }

                comp.plants.forEach((plant) => {
                    const size = 16;
                    const iconHtml = `
                        <div class="custom-marker-wrapper">
                            <div class="marker-dot" style="
                                width: ${size}px;
                                height: ${size}px;
                                background-color: ${comp.color};
                                box-shadow: 0 0 10px ${comp.color}, 0 0 20px ${comp.color};
                            "></div>
                        </div>
                    `;

                    const customIcon = L.divIcon({
                        html: iconHtml,
                        className: '',
                        iconSize: [size, size],
                        iconAnchor: [size / 2, size / 2]
                    });

                    const marker = L.marker(plant.coords, { icon: customIcon }).addTo(map);

                    const locData = {
                        title: plant.name,
                        company: comp.name,
                        badge: plant.type,
                        role: plant.role,
                        text: `<b>Електростанція компанії ${comp.name}</b><br>Генераційна потужність: ${plant.cap}`,
                        specs: [
                            { k: "Оператор", v: comp.name },
                            { k: "Тип станції", v: plant.type },
                            { k: "Потужність", v: plant.cap },
                            { k: "Статус", v: "Діючий об'єкт" }
                        ]
                    };

                    const popupContent = createJapanCardHtml(locData, comp.color);
                    marker.bindPopup(popupContent, { maxWidth: 310, minWidth: 290, offset: [0, -6] });
                    currentMarkers.push(marker);
                });
            });
        }

        function renderScene(type) {
            clearLayers();

            const isRobot = (type === 'robots');
            const data = robotLocations;

            data.forEach(loc => {
                if (!loc.isHub) {
                    const curveCoords = createCurvePoints(loc.coords, WALTHAM_COORDS);
                    const polyline = L.polyline(curveCoords, {
                        className: 'supply-line-robot',
                        interactive: false
                    }).addTo(map);
                    currentLines.push(polyline);
                }
            });

            data.forEach(loc => {
                const dotClass = loc.isHub ? 'dot-hub-robot' : 'dot-robot';
                const size = loc.isHub ? 26 : 18;

                const iconHtml = `
                    <div class="custom-marker-wrapper">
                        <div class="marker-dot ${dotClass}"></div>
                    </div>
                `;

                const customIcon = L.divIcon({
                    html: iconHtml,
                    className: '',
                    iconSize: [size, size],
                    iconAnchor: [size / 2, size / 2]
                });

                const marker = L.marker(loc.coords, { 
                    icon: customIcon,
                    zIndexOffset: loc.isHub ? 1500 : 500
                }).addTo(map);

                const popupContent = createCardHtml(loc, type);
                marker.bindPopup(popupContent, { maxWidth: 310, minWidth: 290, offset: [0, -6] });
                currentMarkers.push(marker);
            });
        }

        function selectOption(type) {
            const title = document.getElementById('panel-title');
            const selectedText = document.getElementById('selectedOptionMain');
            const itemRobots = document.getElementById('item-robots');
            const itemConstruction = document.getElementById('item-construction');
            const itemCanadaConstruction = document.getElementById('item-canada-construction');
            const itemIndiaCement = document.getElementById('item-india-cement');
            const itemWireLogistics = document.getElementById('item-wire-logistics');
            const itemRoutes = document.getElementById('item-routes');
            const itemJapan = document.getElementById('item-japan');
            const subPanel = document.getElementById('dropdownPanelSub');

            [itemRobots, itemConstruction, itemCanadaConstruction, itemIndiaCement, itemWireLogistics, itemRoutes, itemJapan].forEach(el => {
                if (el) el.classList.remove('active');
            });

            if (type === 'robots') {
                selectedText.innerText = "🤖 Boston Dynamics";
                itemRobots.classList.add('active');
                title.innerText = "Ключові локації та ланцюжки постачання Boston Dynamics";
                subPanel.style.display = 'none';
                renderScene('robots');
                map.setView([25, 10], 3);
            } else if (type === 'construction') {
                selectedText.innerText = "🏗️ Будівельні компанії & Цемент";
                itemConstruction.classList.add('active');
                title.innerText = "Будівельні компанії та цементні заводи США з логістичними лініями";
                subPanel.style.display = 'none';
                renderConstructionView();
            } else if (type === 'canada-construction') {
                selectedText.innerText = "🇨🇦 Будівництво (Канада)";
                if (itemCanadaConstruction) itemCanadaConstruction.classList.add('active');
                title.innerText = "Будівельні компанії, цементні заводи та логістичні зв'язки в Канаді";
                subPanel.style.display = 'none';
                renderCanadaConstructionWithSupplyChain();
            } else if (type === 'india-cement') {
                selectedText.innerText = "🧱 Будівельні компанії Індії та цементні заводи";
                if (itemIndiaCement) itemIndiaCement.classList.add('active');
                title.innerText = "Будівельні компанії Індії, цементні заводи та логістичні лінії постачання";
                subPanel.style.display = 'none';
                renderIndiaCementWithLogistics();
            } else if (type === 'wire-logistics') {
                selectedText.innerText = "🏭 Дріт та 🚢 Логістика";
                itemWireLogistics.classList.add('active');
                title.innerText = "Виробництво дроту (Китай) та Глобальна Логістика";
                subPanel.style.display = 'none';
                renderWireLogisticsView();
            } else if (type === 'routes') {
                selectedText.innerText = "🚚 Ланцюги постачання";
                itemRoutes.classList.add('active');
                title.innerText = "Глобальні ланцюги: Мідь → Деталі → Продукція (Індонезія, Японія, США, ФРН, Китай, Корея)";
                subPanel.style.display = 'none';
                renderFullSupplyChain();
            } else if (type === 'japan') {
                selectedText.innerText = "⚡ Електростанції Японії";
                itemJapan.classList.add('active');
                title.innerText = "Мережі електростанцій енергетичних компаній Японії";
                subPanel.style.display = 'block';
                renderJapanPowerPlantsView();
            }

            document.getElementById('dropdownPanelMain').classList.remove('open');
        }

        function selectCompany(companyId) {
            selectedCompanyId = companyId;
            
            const subItems = document.querySelectorAll('#subDropdownContent .dropdown-item');
            subItems.forEach(item => item.classList.remove('active'));

            const activeBtn = document.getElementById(`sub-${companyId}`);
            if (activeBtn) activeBtn.classList.add('active');

            const selectedTextSub = document.getElementById('selectedOptionSub');
            if (companyId === 'all') {
                selectedTextSub.innerText = "🏢 Всі компанії";
            } else {
                const compObj = japanCompanies.find(c => c.id === companyId);
                selectedTextSub.innerText = compObj ? compObj.name : "🏢 Всі компанії";
            }

            renderJapanPowerPlantsView();
            document.getElementById('dropdownPanelSub').classList.remove('open');
        }
    </script>
</body>
