<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Локації постачальників, розробників та глобальної логістики</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="controls-container">
        <div class="dropdown-panel" id="dropdownPanelMain">
            <button class="dropdown-btn" onclick="toggleDropdown('dropdownPanelMain')">
                <span id="selectedOptionMain">🤖 Робототехніка</span>
                <span class="dropdown-arrow">▼</span>
            </button>
            <div class="dropdown-content">
                <button class="dropdown-item active" id="item-robots" onclick="selectOption('robots')">🤖 Робототехніка</button>
                <button class="dropdown-item" id="item-construction" onclick="selectOption('construction')">🏗️ Будівництво</button>
                <button class="dropdown-item" id="item-energy" onclick="selectOption('energy')">⚡ Енергетика</button>
                <button class="dropdown-item" id="item-minerals" onclick="selectOption('minerals')">⛏️ Мінерали</button>
            </div>
        </div>

        <div class="dropdown-panel" id="dropdownPanelSub" style="display: none;">
            <button class="dropdown-btn" onclick="toggleDropdown('dropdownPanelSub')">
                <span id="selectedOptionSub">Оберіть підрозділ</span>
                <span class="dropdown-arrow">▼</span>
            </button>
            <div class="dropdown-content" id="subDropdownContent"></div>
        </div>
    </div>

    <div id="map"></div>

    <!-- Country data modules -->
    <script src="data/continents/north_america/usa/robots.js"></script>
    <script src="data/continents/north_america/usa/construction.js"></script>
    <script src="data/continents/north_america/usa/minerals.js"></script>
    <script src="data/continents/north_america/usa/automotive_industry.js"></script>
    <script src="data/continents/north_america/canada/construction.js"></script>
    <script src="data/continents/asia/india/construction.js"></script>
    <script src="data/continents/europe/switzerland/robots.js"></script>
    <script src="data/continents/asia/south_korea/robots.js"></script>
    <script src="data/continents/asia/south_korea/minerals.js"></script>
    <script src="data/continents/asia/south_korea/automotive_industry.js"></script>
    <script src="data/continents/asia/taiwan/robots.js"></script>
    <script src="data/continents/asia/japan/robots.js"></script>
    <script src="data/continents/asia/japan/minerals.js"></script>
    <script src="data/continents/asia/japan/automotive_industry.js"></script>
    <script src="data/continents/asia/japan/energy.js"></script>
    <script src="data/continents/asia/china/minerals.js"></script>
    <script src="data/continents/asia/china/automotive_industry.js"></script>
    <script src="data/continents/asia/indonesia/minerals.js"></script>
    <script src="data/continents/asia/indonesia/automotive_industry.js"></script>
    <script src="data/continents/europe/germany/minerals.js"></script>
    <script src="data/continents/europe/germany/automotive_industry.js"></script>
    <script src="data/continents/asia/vietnam/minerals.js"></script>
    <script src="data/continents/europe/netherlands/minerals.js"></script>

    <!-- Leaflet map library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Application modules -->
    <script src="js/map.js"></script>
    <script src="js/routes.js"></script>
    <script src="js/popups.js"></script>
    <script src="js/markers.js"></script>
    <script src="js/scenes/robots.js"></script>
    <script src="js/scenes/construction.js"></script>
    <script src="js/scenes/minerals.js"></script>
    <script src="js/scenes/automotive.js"></script>
    <script src="js/scenes/energy.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
