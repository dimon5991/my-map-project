    <script>
        const WALTHAM_COORDS = [42.3765, -71.2356];

        let map;
        let currentMarkers = [];
        let currentLines = [];
        let selectedCompanyId = 'all';

        document.addEventListener("DOMContentLoaded", function() {
            map = L.map('map', {
                center: [25, 10],
                zoom: 3,
                worldCopyJump: true
            });

            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 16,
                attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ'

            buildSubDropdownMenu();
            renderScene('robots');

            setTimeout(() => { map.invalidateSize(); }, 200);
        });


        function buildSubDropdownMenu() {
            const subContainer = document.getElementById('subDropdownContent');
            let html = `<button class="dropdown-item active" id="sub-all" onclick="selectCompany('all')">🏢 Всі компанії</button>`;
            
            (window.countryData.energy?.japan?.japanCompanies || []).forEach(comp => {
                html += `
                    <button class="dropdown-item" id="sub-${comp.id}" onclick="selectCompany('${comp.id}')">
                        <span class="company-color-indicator" style="background-color: ${comp.color};"></span>
                        ${comp.name}
                    </button>
                `;
            });

            subContainer.innerHTML = html;
        }

        function toggleDropdown(id) {
            const panel = document.getElementById(id);
            panel.classList.toggle('open');
        }

        window.addEventListener('click', function(e) {
            ['dropdownPanelMain', 'dropdownPanelSub'].forEach(id => {
                const panel = document.getElementById(id);
                if (panel && !panel.contains(e.target)) {
                    panel.classList.remove('open');
                }
            });
        });

        function clearLayers() {
            currentMarkers.forEach(m => map.removeLayer(m));
            currentLines.forEach(l => map.removeLayer(l));
            currentMarkers = [];
            currentLines = [];
        }

        function createCardHtml(loc, type) {
            const isRobot = (type === 'robots');
            const badgeClass = isRobot ? 'badge-robot' : 'badge-construction';
            const badgeText = isRobot ? (loc.badge || 'Робототехніка') : 'Будівництво США';

            let imgHtml = loc.image ? `
                <div class="card-img-wrap">
                    <img src="${loc.image}" alt="${loc.title}" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=700&q=80';" />
                </div>
            ` : '';

            let companyHtml = loc.company ? `<div class="popup-company">${loc.company}</div>` : '';
            
            let roleHtml = loc.role ? `
                <div class="card-section-label">Функціональна роль</div>
                <div class="card-role-text">${loc.role}</div>
            ` : '';

            let textHtml = loc.text ? `
                <div class="card-section-label">${isRobot ? 'Опис компонентів' : 'Спеціалізація та потужність'}</div>
                <div class="popup-desc">${loc.text}</div>
            ` : '';

            let specsItems = (loc.specs && loc.specs.length > 0) ? `
                <div class="specs-grid">
                    ${loc.specs.map(s => `
                        <div class="spec-item">
                            <span>${s.k}</span>
                            <span>${s.v}</span>
                        </div>
                    `).join('')}
                </div>
            ` : '';

            return `
                ${imgHtml}
                <div class="card-body">
                    <span class="card-badge ${badgeClass}">${badgeText}</span>
                    <div class="popup-title">${loc.title}</div>
                    ${companyHtml}
                    ${roleHtml}
                    ${textHtml}
                    ${specsItems}
                </div>
            `;
        }

        function createJapanCardHtml(loc, hexColor) {
            let specsItems = (loc.specs || []).map(s => `
                <div class="spec-item">
                    <span>${s.k}</span>
                    <span>${s.v}</span>
                </div>
            `).join('');

            return `
                <div class="card-img-wrap">
                    <img src="https://images.unsplash.com/photo-1542051841857-5f90071e7989?auto=format&fit=crop&w=600&q=80" alt="${loc.company}" />
                </div>
                <div class="card-body">
                    <span class="card-badge" style="background: ${hexColor}22; color: ${hexColor}; border: 1px solid ${hexColor}66;">${loc.badge || 'Електростанція'}</span>
                    <div class="popup-title">${loc.title}</div>
                    <div class="popup-company" style="color: ${hexColor};">${loc.company}</div>
                    
                    <div class="card-section-label">Призначення / Роль</div>
                    <div class="card-role-text">${loc.role}</div>

                    <div class="card-section-label">Опис об'єкта</div>
                    <div class="popup-desc">${loc.text || ''}</div>

                    <div class="specs-grid">
                        ${specsItems}
                    </div>
                </div>
            `;
        }

        function createCurvePoints(fromCoords, toCoords) {
            const lat1 = fromCoords[0], lng1 = fromCoords[1];
            const lat2 = toCoords[0], lng2 = toCoords[1];

            const midLat = (lat1 + lat2) / 2 + Math.abs(lng1 - lng2) * 0.12;
            const midLng = (lng1 + lng2) / 2;

            const points = [];
            for (let t = 0; t <= 1; t += 0.05) {
                const lat = (1 - t) * (1 - t) * lat1 + 2 * (1 - t) * t * midLat + t * t * lat2;
                const lng = (1 - t) * (1 - t) * lng1 + 2 * (1 - t) * t * midLng + t * t * lng2;
                points.push([lat, lng]);
            }
            return points;
        }

        function drawPairConnections(sourceList, targetList, options = {}) {
            const defaultStyle = {
                color: '#00ffff',
                weight: 1.5,
                opacity: 0.6,
                dashArray: '5, 8'
            };
            const style = { ...defaultStyle, ...options };

            sourceList.forEach((src, idx) => {
                const target = targetList[idx % targetList.length];
                const polyline = L.polyline([src.coords, target.coords], style).addTo(map);
                currentLines.push(polyline);
            });
        }

        function renderWireLogisticsView() {
            clearLayers();
            const bounds = [];

            const factoryIcon = L.divIcon({ className: 'custom-factory-marker', iconSize: [16, 16], iconAnchor: [8, 8] });
            (window.countryData.minerals?.china?.wireLocations || []).forEach(loc => {
                const marker = L.marker(loc.coords, { icon: factoryIcon }).addTo(map);
                marker.bindPopup(`
                    <div style="padding: 12px;">
                        <div class="popup-title">🏭 ${loc.title}</div>
                        <div class="popup-desc">${loc.text}</div>
                        <span class="popup-tag tag-wire">Завод дротів та кабелів</span>
                    </div>
                `, { maxWidth: 300 });
                currentMarkers.push(marker);
                bounds.push(loc.coords);
            });

            const destIcon = L.divIcon({ className: 'custom-destination-marker', iconSize: [16, 16], iconAnchor: [8, 8] });
            (Object.values(window.countryData.minerals || {}).flatMap(c => c.wireDestinationsLocations || [])).forEach(loc => {
                const marker = L.marker(loc.coords, { icon: destIcon }).addTo(map);
                marker.bindPopup(`
                    <div style="padding: 12px;">
                        <div class="popup-title">🚢 ${loc.title}</div>
                        <div class="popup-desc">${loc.text}</div>
                        <span class="popup-tag tag-dest">Пункт призначення / Хаб</span>
                    </div>
                `, { maxWidth: 300 });
                currentMarkers.push(marker);
                bounds.push(loc.coords);
            });

            drawPairConnections((window.countryData.minerals?.china?.wireLocations || []), (Object.values(window.countryData.minerals || {}).flatMap(c => c.wireDestinationsLocations || [])));

            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [50, 50] });
            }
        }

        function renderFullSupplyChain() {
            clearLayers();
            const bounds = [];

            const plantIcon = L.divIcon({ className: 'custom-plant-marker', iconSize: [16, 16], iconAnchor: [8, 8] });
            (Object.values(window.countryData.minerals || {}).flatMap(c => c.plantLocations || [])).forEach(loc => {
                const marker = L.marker(loc.coords, { icon: plantIcon }).addTo(map);
                marker.bindPopup(`
                    <div style="padding: 12px;">
                        <div class="popup-title">🏭 ${loc.title}</div>
                        <div class="popup-desc">${loc.text}</div>
                        <span class="popup-tag tag-refinery">1. Рафінування Міді</span>
                    </div>
                `, { maxWidth: 300 });
                currentMarkers.push(marker);
                bounds.push(loc.coords);
            });

            const compIcon = L.divIcon({ className: 'custom-component-marker', iconSize: [16, 16], iconAnchor: [8, 8] });
            (Object.values(window.countryData.automotive_industry || {}).flatMap(c => c.componentSuppliers || [])).forEach(loc => {
                const marker = L.marker(loc.coords, { icon: compIcon }).addTo(map);
                marker.bindPopup(`
                    <div style="padding: 12px;">
                        <div class="popup-title">⚙️ ${loc.title}</div>
                        <div class="popup-desc">${loc.text}</div>
                        <span class="popup-tag tag-component">2. Деталі та Вузли</span>
                    </div>
                `, { maxWidth: 300 });
                currentMarkers.push(marker);
                bounds.push(loc.coords);
            });

            const finalIcon = L.divIcon({ className: 'custom-final-marker', iconSize: [16, 16], iconAnchor: [8, 8] });
            (Object.values(window.countryData.automotive_industry || {}).flatMap(c => c.finalFactories || [])).forEach(loc => {
                const marker = L.marker(loc.coords, { icon: finalIcon }).addTo(map);
                marker.bindPopup(`
                    <div style="padding: 12px;">
                        <div class="popup-title">🚘 ${loc.title}</div>
                        <div class="popup-desc">${loc.text}</div>
                        <span class="popup-tag tag-final">3. Готова Продукція</span>
                    </div>
                `, { maxWidth: 300 });
                currentMarkers.push(marker);
                bounds.push(loc.coords);
            });

            (window.countryData.minerals?.japan?.fullSupplyChains || []).forEach(route => {
                const isStage1 = route.stage === 1;
                const polyline = L.polyline([route.from, route.to], {
                    color: isStage1 ? '#00d2ff' : '#e040fb',
                    weight: isStage1 ? 2 : 3,
                    opacity: 0.8,
                    className: isStage1 ? 'animated-route-stage1' : 'animated-route-stage2'
                }).addTo(map);

                polyline.bindTooltip(route.label, { sticky: true });
                currentLines.push(polyline);
            });

            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [40, 40] });
            }
        }

        function renderConstructionView() {
            clearLayers();

            (window.countryData.construction?.usa?.constructionLocations || []).forEach(loc => {

                    <div class="custom-marker-wrapper">

                `;
                const customIcon = L.divIcon({
                    html: iconHtml,
                    className: '',
                    iconSize: [18, 18],
                    iconAnchor: [9, 9]
                });

                const marker = L.marker(loc.coords, { icon: customIcon }).addTo(map);
                marker.bindPopup(`
                    <div style="padding: 12px;">
                        <div class="popup-title">🏭 ${loc.title}</div>
                        <div class="popup-desc">${loc.text}</div>
                        <span class="popup-tag tag-cement">Цементний завод США</span>
                    </div>
                `, { maxWidth: 300 });
                currentMarkers.push(marker);
            });

            (window.countryData.construction?.usa?.cementSupplyRoutes || []).forEach(route => {
                const polyline = L.polyline([route.from, route.to], {
                    color: '#a855f7',
                    weight: 2,

                polyline.bindTooltip(route.label, { sticky: true });

        function renderCanadaConstructionWithSupplyChain() {
            clearLayers();

            const constrIcon = L.divIcon({
                className: 'custom-canada-construction-marker',
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });

            const cementIcon = L.divIcon({
                className: 'custom-canada-cement-marker',
                iconSize: [14, 14],
                iconAnchor: [7, 7]
            });

            // 1. Нанесення будівельних хабів
            (window.countryData.construction?.canada?.constructionLocations || []).forEach(loc => {
                const marker = L.marker(loc.coords, { icon: constrIcon }).addTo(map);
                marker.bindPopup(`
                    <div style="padding: 12px;">
                        <div class="popup-title">🏗️ ${loc.title}</div>
                        <div class="popup-desc">${loc.text}</div>
                        <span class="popup-tag tag-canada-construction">Будівельний хаб (Канада)</span>
                    </div>
                `, { maxWidth: 300 });
                currentMarkers.push(marker);
            });

            // 2. Нанесення цементних заводів та прокладання логістичних ліній
            (window.countryData.construction?.canada?.cementLocations || []).forEach(plant => {
                const plantMarker = L.marker(plant.coords, { icon: cementIcon }).addTo(map);
                plantMarker.bindPopup(`
                    <div style="padding: 12px;">
                        <div class="popup-title">🏭 Цементний завод</div>
                        <div class="popup-desc"><b>${plant.name}</b><br>Основний постачальник цементу та бетону для регіональних будівельних підрядників.</div>
                        <span class="popup-tag tag-canada-cement">Цементний завод Канади</span>
                    </div>
                `, { maxWidth: 280 });
                currentMarkers.push(plantMarker);

                // Знаходження найближчого будівельного хабу для побудови логістичного зв'язку
                let closestHub = null;
                let minDistance = Infinity;

                (window.countryData.construction?.canada?.constructionLocations || []).forEach(hub => {
                    const dist = Math.hypot(
                        hub.coords[0] - plant.coords[0],
                        hub.coords[1] - plant.coords[1]
                    );
                    if (dist < minDistance) {
                        minDistance = dist;
                        closestHub = hub;
                    }
                });

                if (closestHub) {
                    const polyline = L.polyline([plant.coords, closestHub.coords], {
                        color: '#ff3366',
                        weight: 1.5,
                        opacity: 0.7,
                        dashArray: '4, 8'
                    }).addTo(map);

                    polyline.bindTooltip(`Маршрут постачання: ${plant.name} ➔ ${closestHub.title.split(' ')[0]}`, {
                        sticky: true
                    });

                    currentLines.push(polyline);
                }
            });

            map.flyTo([52.0, -96.0], 4);
        }

            const cementIcon = L.divIcon({
                className: 'custom-india-cement-marker',

            });

            (window.countryData.construction?.india?.cementLocations || []).forEach(plant => {
                const marker = L.marker(plant.coords, { icon: cementIcon }).addTo(map);
                const popupContent = `
                    <div style="padding: 12px;">
                        <div class="popup-title">🧱 ${plant.title}</div>
                        <div class="popup-desc">${plant.text}</div>
                        <span class="popup-tag tag-india-cement">Цементний завод Індії</span>
                    </div>
                `;
                marker.bindPopup(popupContent, { maxWidth: 300 });
                currentMarkers.push(marker);

                const targetsList = plant.targets || (plant.targetCoords ? [plant.targetCoords] : []);
                
                targetsList.forEach(target => {
                    const polyline = L.polyline([plant.coords, target], {
                        color: '#ff0055',
                        weight: 2,
                        opacity: 0.8,
                        className: 'logistics-line-india'
                    }).addTo(map);

                    currentLines.push(polyline);
                });
            });

            map.flyTo([20.5937, 78.9629], 5);

        function renderJapanPowerPlantsView() {
            clearLayers();

            const targetCompanies = selectedCompanyId === 'all' 
                ? (window.countryData.energy?.japan?.japanCompanies || []) 
                : (window.countryData.energy?.japan?.japanCompanies || []).filter(c => c.id === selectedCompanyId);

            if (selectedCompanyId !== 'all' && targetCompanies.length > 0 && targetCompanies[0].plants.length > 0) {
                map.flyTo(targetCompanies[0].plants[0].coords, 7);
            } else {
                map.flyTo([36.5, 138.0], 5);
            }

            targetCompanies.forEach(comp => {
                for (let i = 0; i < comp.plants.length - 1; i++) {
                    const plantA = comp.plants[i];
                    const plantB = comp.plants[i + 1];

                    const curveCoords = createCurvePoints(plantA.coords, plantB.coords);
                    const polyline = L.polyline(curveCoords, {
                        className: 'supply-line-custom',
                        color: comp.color,
                        interactive: false
                    }).addTo(map);
                    currentLines.push(polyline);
                }

                comp.plants.forEach((plant) => {
                    const size = 16;
                    const iconHtml = `
                        <div class="custom-marker-wrapper">
                            <div class="marker-dot" style="
                                width: ${size}px;
                                height: ${size}px;
                                background-color: ${comp.color};
                                box-shadow: 0 0 10px ${comp.color}, 0 0 20px ${comp.color};
                            "></div>
                        </div>
                    `;

                    const customIcon = L.divIcon({
                        html: iconHtml,
                        className: '',
                        iconSize: [size, size],
                        iconAnchor: [size / 2, size / 2]
                    });

                    const marker = L.marker(plant.coords, { icon: customIcon }).addTo(map);

                    const locData = {
                        title: plant.name,
                        company: comp.name,
                        badge: plant.type,
                        role: plant.role,
                        text: `<b>Електростанція компанії ${comp.name}</b><br>Генераційна потужність: ${plant.cap}`,
                        specs: [
                            { k: "Оператор", v: comp.name },
                            { k: "Тип станції", v: plant.type },
                            { k: "Потужність", v: plant.cap },
                            { k: "Статус", v: "Діючий об'єкт" }
                        ]
                    };

                    const popupContent = createJapanCardHtml(locData, comp.color);
                    marker.bindPopup(popupContent, { maxWidth: 310, minWidth: 290, offset: [0, -6] });
                    currentMarkers.push(marker);
                });
            });
        }

        function renderScene(type) {
            clearLayers();

            const isRobot = (type === 'robots');
            const data = (Object.values(window.countryData.robots || {}).flatMap(c => c.robotLocations || []));

            data.forEach(loc => {
                if (!loc.isHub) {
                    const curveCoords = createCurvePoints(loc.coords, WALTHAM_COORDS);
                    const polyline = L.polyline(curveCoords, {
                        className: 'supply-line-robot',
                        interactive: false
                    }).addTo(map);
                    currentLines.push(polyline);
                }
            });

            data.forEach(loc => {
                const dotClass = loc.isHub ? 'dot-hub-robot' : 'dot-robot';
                const size = loc.isHub ? 26 : 18;

                const iconHtml = `
                    <div class="custom-marker-wrapper">
                        <div class="marker-dot ${dotClass}"></div>
                    </div>
                `;

                const customIcon = L.divIcon({
                    html: iconHtml,
                    className: '',
                    iconSize: [size, size],
                    iconAnchor: [size / 2, size / 2]
                });

                const marker = L.marker(loc.coords, { 
                    icon: customIcon,
                    zIndexOffset: loc.isHub ? 1500 : 500
                }).addTo(map);

                const popupContent = createCardHtml(loc, type);
                marker.bindPopup(popupContent, { maxWidth: 310, minWidth: 290, offset: [0, -6] });
                currentMarkers.push(marker);
            });
        }

        function selectOption(type) {
            const title = document.getElementById('panel-title');
            const selectedText = document.getElementById('selectedOptionMain');
            const itemRobots = document.getElementById('item-robots');
            const itemConstruction = document.getElementById('item-construction');
            const itemCanadaConstruction = document.getElementById('item-canada-construction');
            const itemIndiaCement = document.getElementById('item-india-cement');
            const itemWireLogistics = document.getElementById('item-wire-logistics');
            const itemRoutes = document.getElementById('item-routes');
            const itemJapan = document.getElementById('item-japan');
            const subPanel = document.getElementById('dropdownPanelSub');

            [itemRobots, itemConstruction, itemCanadaConstruction, itemIndiaCement, itemWireLogistics, itemRoutes, itemJapan].forEach(el => {
                if (el) el.classList.remove('active');
            });

            if (type === 'robots') {
                selectedText.innerText = "🤖 Boston Dynamics";
                itemRobots.classList.add('active');
                title.innerText = "Ключові локації та ланцюжки постачання Boston Dynamics";
                subPanel.style.display = 'none';
                renderScene('robots');
                map.setView([25, 10], 3);
            } else if (type === 'construction') {
                selectedText.innerText = "🏗️ Будівельні компанії & Цемент";
                itemConstruction.classList.add('active');
                title.innerText = "Будівельні компанії та цементні заводи США з логістичними лініями";
                subPanel.style.display = 'none';
                renderConstructionView();
            } else if (type === 'canada-construction') {
                selectedText.innerText = "🇨🇦 Будівництво (Канада)";
                if (itemCanadaConstruction) itemCanadaConstruction.classList.add('active');
                title.innerText = "Будівельні компанії, цементні заводи та логістичні зв'язки в Канаді";
                subPanel.style.display = 'none';
                renderCanadaConstructionWithSupplyChain();
            } else if (type === 'india-cement') {
                selectedText.innerText = "🧱 Будівельні компанії Індії та цементні заводи";
                if (itemIndiaCement) itemIndiaCement.classList.add('active');
                title.innerText = "Будівельні компанії Індії, цементні заводи та логістичні лінії постачання";
                subPanel.style.display = 'none';
                renderIndiaCementWithLogistics();
            } else if (type === 'wire-logistics') {
                selectedText.innerText = "🏭 Дріт та 🚢 Логістика";
                itemWireLogistics.classList.add('active');
                title.innerText = "Виробництво дроту (Китай) та Глобальна Логістика";
                subPanel.style.display = 'none';
                renderWireLogisticsView();
            } else if (type === 'routes') {
                selectedText.innerText = "🚚 Ланцюги постачання";
                itemRoutes.classList.add('active');
                title.innerText = "Глобальні ланцюги: Мідь → Деталі → Продукція (Індонезія, Японія, США, ФРН, Китай, Корея)";
                subPanel.style.display = 'none';
                renderFullSupplyChain();
            } else if (type === 'japan') {
                selectedText.innerText = "⚡ Електростанції Японії";
                itemJapan.classList.add('active');
                title.innerText = "Мережі електростанцій енергетичних компаній Японії";
                subPanel.style.display = 'block';
                renderJapanPowerPlantsView();
            }

            document.getElementById('dropdownPanelMain').classList.remove('open');
        }

        function selectCompany(companyId) {
            selectedCompanyId = companyId;
            
            const subItems = document.querySelectorAll('#subDropdownContent .dropdown-item');
            subItems.forEach(item => item.classList.remove('active'));

            const activeBtn = document.getElementById(`sub-${companyId}`);
            if (activeBtn) activeBtn.classList.add('active');

            const selectedTextSub = document.getElementById('selectedOptionSub');
            if (companyId === 'all') {
                selectedTextSub.innerText = "🏢 Всі компанії";
            } else {
                const compObj = (window.countryData.energy?.japan?.japanCompanies || []).find(c => c.id === companyId);
                selectedTextSub.innerText = compObj ? compObj.name : "🏢 Всі компанії";
            }

            renderJapanPowerPlantsView();
            document.getElementById('dropdownPanelSub').classList.remove('open');
        }
    </script>
</body>
</html>
